# Canonical golangci-lint config for the Go fleet (baseline established in narada).
# golangci-lint v2 schema.
version: "2"

run:
  timeout: 5m

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose
    - misspell
    - unconvert
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
